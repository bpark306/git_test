<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Homepage</h1>

    <!-- target="_blank" opens in new tab -->
     <h2>New Tab</h2>
    <a href="https://www.theodinproject.com/about" target="_blank rel="noreferrer">About the Odin Project</a>
    
    <h2>Current Tab</h2>
    <!-- no specified target attribute or target="_self" opens in current tab -->
    <a href="https://www.theodinproject.com/about" target="_self" rel="noreferrer">About the Odin Project</a>
    
    <!-- rel attribute describes multi-valued relation b/w the current page and linked documents  -->

    <h2>Relative Link</h2>
    <!-- Relative Links v. Absolute Links -->
     <a href="./pages/about.html">About</a>

     <h2>Absolute Path Image</h2>
     <img src="https://www.theodinproject.com/mstile-310x310.png" alt="The Odin Project Logo" height="310" width="=310">

    <h2>Relative Path Image</h2>
    <img src="./images/dog.jpg" alt="charles the dog in all his glory" height="310" width="310">
    </body>
</html>
